<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo do Dino</title>
    <!-- Tailwind CSS para utilitários de estilo rápidos e limpos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts para tipografia no estilo Pixel / Retro Moderno -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: linear-gradient(135deg, #ff6b00 0%, #e65c00 100%);
        min-height: 100vh;
      }

      .pixel-font {
        font-family: "Press Start 2P", cursive;
      }

      /* 
      Filtro mágico CSS no iframe:
      - invert(1): inverte as cores (preto vira branco, fundo claro vira escuro/transparente)
      - contrast(1.8) e brightness(1.2): aumenta o destaque para as linhas brancas ficarem super nitidas
      - mix-blend-mode: color-burn / multiply para integrar suavemente
    */
      .dino-iframe {
        filter: invert(1) contrast(1.6) brightness(1.2)
          drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.3));
        mix-blend-mode: screen;
        border: none;
        width: 100%;
        height: 100%;
      }

      /* Animações sutis */
      .bounce-gentle {
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
    </style>
  </head>
  <body
    class="flex flex-col items-center justify-between p-4 md:p-8 text-white select-none"
  >
    <!-- Cabeçalho -->
    <header class="text-center mt-2 mb-6">
      <div
        class="inline-flex items-center gap-2 bg-black/20 backdrop-blur-md px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider mb-3 text-orange-100 border border-white/10"
      >
        <span>🦖 Clássico Arcade</span>
      </div>
      <h1
        class="text-3xl md:text-5xl font-extrabold tracking-tight drop-shadow-md pixel-font text-white flex items-center justify-center gap-3"
      >
        JOGO DO DINO
      </h1>
      <p class="text-orange-100/90 mt-2 text-sm md:text-base font-medium">
        Corra, salte dos cactos e supere sua pontuação mais alta!
      </p>
    </header>

    <!-- Container Principal do Jogo -->
    <main
      class="w-full max-w-4xl flex-1 flex flex-col items-center justify-center my-auto"
    >
      <div
        class="w-full bg-black/20 backdrop-blur-xl border border-white/20 rounded-3xl p-3 md:p-6 shadow-2xl transition-all duration-300 hover:shadow-orange-950/40"
      >
        <!-- Moldura do Canvas do Jogo -->
        <div
          class="relative w-full aspect-[16/9] sm:aspect-[21/9] bg-orange-950/40 rounded-2xl overflow-hidden border border-white/10 flex items-center justify-center"
        >
          <!-- Embed do Jogo -->
          <iframe
            src="https://chromedino.com/embed/"
            class="dino-iframe"
            scrolling="no"
            loading="lazy"
            title="Jogo do Dino Chrome"
          ></iframe>
        </div>
      </div>
    </main>

    <!-- Instruções de Controles -->
    <footer
      class="w-full max-w-4xl mt-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs md:text-sm font-semibold text-orange-100/80 bg-black/15 backdrop-blur-md rounded-2xl p-4 border border-white/10"
    >
      <div class="flex items-center gap-3">
        <span
          class="bg-white/20 text-white px-2.5 py-1 rounded-lg border border-white/30 shadow-sm font-mono"
          >ESPAÇO</span
        >
        <span>ou</span>
        <span
          class="bg-white/20 text-white px-2.5 py-1 rounded-lg border border-white/30 shadow-sm font-mono"
          >SETA CIMA</span
        >
        <span>= Pular</span>
      </div>

      <div class="flex items-center gap-3">
        <span
          class="bg-white/20 text-white px-2.5 py-1 rounded-lg border border-white/30 shadow-sm font-mono"
          >SETA BAIXO</span
        >
        <span>= Agachar</span>
      </div>

      <div class="hidden md:flex items-center gap-1.5 text-white/90">
        <span
          class="inline-block w-2 h-2 rounded-full bg-green-400 bounce-gentle"
        ></span>
        <span>Toque na tela para dispositivos móveis</span>
      </div>
    </footer>
  </body>
</html>
