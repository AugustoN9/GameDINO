<!doctype html>
<html lang="pt-BR" class="h-full w-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Cobrinha - Pixel Perfect</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: linear-gradient(135deg, #ff6b00 0%, #e65c00 100%);
      }

      .pixel-font {
        font-family: "Press Start 2P", cursive;
      }

      /* Preserva pixel art afiado */
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Modo Tela Cheia */
      body.mode-fullscreen #game-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 10;
        border-radius: 0;
        padding: 0;
        background: #e65c00;
        max-width: 100vw;
      }

      body::-webkit-scrollbar { display: none; }
      body { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body
    id="body-root"
    class="min-h-full w-full flex flex-col items-center justify-between p-3 md:p-6 text-white select-none transition-all duration-300 relative"
  >
    <!-- Cabeçalho -->
    <header id="main-header" class="text-center mt-1 mb-3 z-20 w-full max-w-4xl flex flex-col items-center">
      <div class="flex items-center justify-between w-full mb-2">
        <div class="inline-flex items-center gap-2 bg-black/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider text-orange-100 border border-white/10">
          <span>🐍 Snake Runner HD</span>
        </div>

        <div class="flex items-center gap-2">
          <button
            onclick="toggleAudio()"
            id="audio-btn"
            class="bg-black/30 hover:bg-black/50 backdrop-blur-md border border-white/20 text-white p-1.5 px-3 rounded-full text-xs font-bold transition-all shadow-lg flex items-center gap-1.5"
          >
            🔊 Som
          </button>

          <button
            onclick="toggleLayoutMode()"
            class="bg-black/30 hover:bg-black/50 backdrop-blur-md border border-white/20 text-white px-3 py-1.5 rounded-full text-xs font-bold transition-all hover:scale-105 active:scale-95 shadow-lg flex items-center gap-1.5"
          >
            <span id="mode-icon">🖥️</span>
            <span id="mode-text" class="hidden sm:inline">Tela Cheia</span>
          </button>
        </div>
      </div>

      <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight drop-shadow-md pixel-font text-white">
        SNAKE GAME
      </h1>
    </header>

    <!-- Container do Jogo -->
    <main class="w-full max-w-4xl flex-1 flex flex-col items-center justify-center my-auto z-10">
      <div
        id="game-container"
        class="w-full bg-black/20 backdrop-blur-xl border border-white/20 rounded-3xl p-2 md:p-4 shadow-2xl transition-all duration-300 relative flex flex-col items-center justify-center"
      >
        <div class="relative w-full aspect-[4/3] max-h-[60vh] bg-orange-950/50 rounded-2xl overflow-hidden border border-white/10 flex items-center justify-center">
          <canvas id="gameCanvas" class="w-full h-full block"></canvas>

          <!-- UI Menu / Game Over -->
          <div id="game-overlay" class="absolute inset-0 bg-black/80 backdrop-blur-md flex flex-col items-center justify-center p-4 z-30">
            <h2 id="overlay-title" class="pixel-font text-lg md:text-2xl text-yellow-400 mb-2 text-center drop-shadow">
              SELEÇÃO DE SKIN
            </h2>

            <p id="overlay-subtitle" class="text-xs md:text-sm text-orange-100/90 mb-4 font-medium text-center">
              Coma 10 maçãs para avançar de nível e acelerar!
            </p>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 max-w-lg w-full">
              <button onclick="selectSkin('classic')" id="btn-classic" class="skin-btn bg-white/20 hover:bg-white/30 border-2 border-yellow-400 p-3 rounded-xl flex flex-col items-center gap-1 transition-all">
                <span class="text-2xl">🐍</span>
                <span class="text-[11px] font-bold">Verde Mamba</span>
              </button>
              <button onclick="selectSkin('nyan')" id="btn-nyan" class="skin-btn bg-white/10 hover:bg-white/30 border border-white/20 p-3 rounded-xl flex flex-col items-center gap-1 transition-all">
                <span class="text-2xl">🌈</span>
                <span class="text-[11px] font-bold">Nyan Snake</span>
              </button>
              <button onclick="selectSkin('sans')" id="btn-sans" class="skin-btn bg-white/10 hover:bg-white/30 border border-white/20 p-3 rounded-xl flex flex-col items-center gap-1 transition-all">
                <span class="text-2xl">💀</span>
                <span class="text-[11px] font-bold">Caveira/Sans</span>
              </button>
              <button onclick="selectSkin('goku')" id="btn-goku" class="skin-btn bg-white/10 hover:bg-white/30 border border-white/20 p-3 rounded-xl flex flex-col items-center gap-1 transition-all">
                <span class="text-2xl">⚡</span>
                <span class="text-[11px] font-bold">Saiyajin</span>
              </button>
            </div>

            <div id="score-summary" class="hidden flex flex-col items-center gap-2 mb-4 text-xs sm:text-sm font-pixel bg-white/10 px-4 py-3 rounded-lg border border-white/20">
              <span class="text-orange-200">Pontuação: <span id="final-score" class="text-white">0</span></span>
              <span class="text-yellow-300">Nível Alcançado: <span id="final-level" class="text-white">1</span></span>
            </div>

            <button
              onclick="startGame()"
              class="bg-yellow-500 hover:bg-yellow-400 text-black font-pixel text-xs sm:text-sm px-6 py-3 rounded-xl shadow-lg transition-transform hover:scale-105 active:scale-95"
            >
              INICIAR JOGO
            </button>
          </div>
        </div>

        <!-- Controles Virtuais Touch -->
        <div class="flex flex-col items-center gap-1 mt-3 sm:hidden z-20">
          <button onclick="changeDir('UP')" class="bg-white/20 active:bg-white/40 p-3 rounded-xl text-lg w-12 h-12 flex items-center justify-center border border-white/20">▲</button>
          <div class="flex gap-4">
            <button onclick="changeDir('LEFT')" class="bg-white/20 active:bg-white/40 p-3 rounded-xl text-lg w-12 h-12 flex items-center justify-center border border-white/20">◀</button>
            <button onclick="changeDir('DOWN')" class="bg-white/20 active:bg-white/40 p-3 rounded-xl text-lg w-12 h-12 flex items-center justify-center border border-white/20">▼</button>
            <button onclick="changeDir('RIGHT')" class="bg-white/20 active:bg-white/40 p-3 rounded-xl text-lg w-12 h-12 flex items-center justify-center border border-white/20">▶</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Rodapé -->
    <footer
      id="main-footer"
      class="w-full max-w-4xl mt-3 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs font-semibold text-orange-100/80 bg-black/15 backdrop-blur-md rounded-2xl p-3 border border-white/10 z-20"
    >
      <div class="flex items-center gap-2">
        <span class="bg-white/20 text-white px-2 py-0.5 rounded border border-white/30 font-mono">SETAS</span>
        <span>ou</span>
        <span class="bg-white/20 text-white px-2 py-0.5 rounded border border-white/30 font-mono">W A S D</span>
        <span>= Controlar Direção</span>
      </div>
    </footer>

    <!-- Lógica do Jogo -->
    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const GRID_SIZE = 20;
      const CANVAS_SIZE = 400;
      canvas.width = CANVAS_SIZE;
      canvas.height = CANVAS_SIZE;

      ctx.imageSmoothingEnabled = false;

      // Sons Sintéticos via Web Audio API
      let audioMuted = false;
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playSound(type) {
        if (audioMuted) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          if (type === 'eat') {
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
          } else if (type === 'levelUp') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
          } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
          }
        } catch (e) {}
      }

      function toggleAudio() {
        audioMuted = !audioMuted;
        document.getElementById('audio-btn').innerText = audioMuted ? '🔇 Mudo' : '🔊 Som';
      }

      let isPlaying = false;
      let score = 0;
      let level = 1;
      let highScore = localStorage.getItem('snake_highscore') || 0;
      let selectedSkin = 'classic';
      let gameInterval;
      
      // Configuração dos Níveis
      const INITIAL_SPEED = 180; // Velocidade inicial lenta e confortável
      const SPEED_INCREMENT = 15; // Aumento de velocidade a cada nível
      const MIN_SPEED = 45;       // Limite de velocidade máxima
      let currentSpeed = INITIAL_SPEED;

      let snake = [];
      let direction = 'RIGHT';
      let nextDirection = 'RIGHT';
      let food = { x: 0, y: 0 };

      const SKINS = {
        classic: { head: '#00FF66', body: '#00CC55' },
        nyan: { head: '#FFDD00', rainbow: ['#FF0000', '#FF7700', '#FFFF00', '#00FF00', '#0099FF', '#8800FF'] },
        sans: { head: '#FFFFFF', body: '#0066FF' },
        goku: { head: '#FFD700', body: '#FF5500' }
      };

      function selectSkin(skinKey) {
        selectedSkin = skinKey;
        document.querySelectorAll('.skin-btn').forEach(btn => {
          btn.classList.remove('border-yellow-400', 'bg-white/20');
          btn.classList.add('border-white/20', 'bg-white/10');
        });
        const activeBtn = document.getElementById(`btn-${skinKey}`);
        if (activeBtn) {
          activeBtn.classList.add('border-yellow-400', 'bg-white/20');
        }
      }

      function startGame() {
        document.getElementById('game-overlay').classList.add('hidden');
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];
        direction = 'RIGHT';
        nextDirection = 'RIGHT';
        score = 0;
        level = 1;
        currentSpeed = INITIAL_SPEED;
        isPlaying = true;
        spawnFood();
        
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, currentSpeed);
      }

      function spawnFood() {
        food = {
          x: Math.floor(Math.random() * (CANVAS_SIZE / GRID_SIZE)),
          y: Math.floor(Math.random() * (CANVAS_SIZE / GRID_SIZE))
        };
        for (let segment of snake) {
          if (segment.x === food.x && segment.y === food.y) {
            spawnFood();
            break;
          }
        }
      }

      function changeDir(newDir) {
        if (!isPlaying) return;
        if (newDir === 'LEFT' && direction !== 'RIGHT') nextDirection = 'LEFT';
        if (newDir === 'UP' && direction !== 'DOWN') nextDirection = 'UP';
        if (newDir === 'RIGHT' && direction !== 'LEFT') nextDirection = 'RIGHT';
        if (newDir === 'DOWN' && direction !== 'UP') nextDirection = 'DOWN';
      }

      function gameLoop() {
        direction = nextDirection;
        const head = { ...snake[0] };

        if (direction === 'LEFT') head.x -= 1;
        if (direction === 'UP') head.y -= 1;
        if (direction === 'RIGHT') head.x += 1;
        if (direction === 'DOWN') head.y += 1;

        // Colisão com Paredes
        const maxGrid = CANVAS_SIZE / GRID_SIZE;
        if (head.x < 0 || head.x >= maxGrid || head.y < 0 || head.y >= maxGrid) {
          gameOver();
          return;
        }

        // Colisão com o Corpo
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === head.x && snake[i].y === head.y) {
            gameOver();
            return;
          }
        }

        snake.unshift(head);

        // Comer Fruta
        if (head.x === food.x && head.y === food.y) {
          score += 1;
          
          // Mudança de Nível a cada 10 maçãs comidas
          const newLevel = Math.floor(score / 10) + 1;
          if (newLevel > level) {
            level = newLevel;
            playSound('levelUp');
            
            // Aumenta a velocidade (reduz o intervalo do temporizador)
            currentSpeed = Math.max(MIN_SPEED, INITIAL_SPEED - (level - 1) * SPEED_INCREMENT);
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, currentSpeed);
          } else {
            playSound('eat');
          }

          spawnFood();
        } else {
          snake.pop();
        }

        render();
      }

      function render() {
        ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

        // Grid do fundo
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        for (let i = 0; i < CANVAS_SIZE; i += GRID_SIZE) {
          ctx.beginPath();
          ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_SIZE);
          ctx.moveTo(0, i); ctx.lineTo(CANVAS_SIZE, i);
          ctx.stroke();
        }

        // Maçã
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(food.x * GRID_SIZE + 3, food.y * GRID_SIZE + 3, GRID_SIZE - 6, GRID_SIZE - 6);

        // Renderizar Cobra
        const skin = SKINS[selectedSkin] || SKINS.classic;

        snake.forEach((segment, index) => {
          const x = segment.x * GRID_SIZE;
          const y = segment.y * GRID_SIZE;

          if (index === 0) {
            ctx.fillStyle = skin.head;
            ctx.fillRect(x + 1, y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            ctx.fillStyle = '#000000';
            ctx.fillRect(x + 4, y + 4, 3, 3);
            ctx.fillRect(x + 12, y + 4, 3, 3);
          } else {
            if (selectedSkin === 'nyan') {
              const rainbowColors = skin.rainbow;
              ctx.fillStyle = rainbowColors[index % rainbowColors.length];
            } else {
              ctx.fillStyle = skin.body;
            }
            ctx.fillRect(x + 2, y + 2, GRID_SIZE - 4, GRID_SIZE - 4);
          }
        });

        // HUD Superior
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '9px "Press Start 2P"';
        ctx.fillText(`LVL ${level}`, 15, 20);
        ctx.fillText(`HI ${String(highScore).padStart(4, '0')} ${String(score).padStart(4, '0')}`, CANVAS_SIZE - 150, 20);
      }

      function gameOver() {
        isPlaying = false;
        clearInterval(gameInterval);
        playSound('hit');

        if (score > highScore) {
          highScore = score;
          localStorage.setItem('snake_highscore', highScore);
        }

        document.getElementById('overlay-title').innerText = "FIM DE JOGO!";
        document.getElementById('overlay-subtitle').innerText = "Sua cobrinha bateu! Tente novamente:";
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-level').innerText = level;
        document.getElementById('score-summary').classList.remove('hidden');
        document.getElementById('game-overlay').classList.remove('hidden');
      }

      // Teclado
      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeDir('LEFT');
        if (e.code === 'ArrowUp' || e.code === 'KeyW') changeDir('UP');
        if (e.code === 'ArrowRight' || e.code === 'KeyD') changeDir('RIGHT');
        if (e.code === 'ArrowDown' || e.code === 'KeyS') changeDir('DOWN');
        if (e.code === 'Space' && !isPlaying && !document.getElementById('game-overlay').classList.contains('hidden')) {
          startGame();
        }
      });

      // Tela Cheia
      let isFullscreenMode = false;
      function toggleLayoutMode() {
        isFullscreenMode = !isFullscreenMode;
        const body = document.getElementById('body-root');
        const modeText = document.getElementById('mode-text');
        const modeIcon = document.getElementById('mode-icon');

        if (isFullscreenMode) {
          body.classList.add('mode-fullscreen');
          modeText.innerText = "Modo Box";
          modeIcon.innerText = "🔲";
        } else {
          body.classList.remove('mode-fullscreen');
          modeText.innerText = "Tela Cheia";
          modeIcon.innerText = "🖥️";
        }
      }

      // Desenho Inicial
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '10px "Press Start 2P"';
      ctx.fillText("ESCOLHA A SKIN E CLIQUE EM INICIAR", 40, 200);
    </script>
  </body>
</html>
